name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.1.0)'
        required: true

permissions:
  contents: write   # needed to create the release and upload assets

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            '${{ github.event.inputs.version }}'
          }
          if (-not $version) { throw 'Could not determine a version to build.' }
          Write-Host "Building version $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build WinChime.sln -c Release -warnaserror -p:Version=${{ steps.version.outputs.version }}

      # Two flavours, because the trade-off genuinely matters to users:
      #   framework-dependent -> ~0.3 MB, needs the .NET 8 Desktop Runtime installed
      #   self-contained      -> ~155 MB, single file, no prerequisites at all
      - name: Publish framework-dependent
        run: >
          dotnet publish src/WinChime.App
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/framework-dependent

      - name: Publish self-contained
        run: >
          dotnet publish src/WinChime.App
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/self-contained

      - name: Package
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item LICENSE, README.md publish/framework-dependent/
          Copy-Item LICENSE, README.md publish/self-contained/
          Compress-Archive publish/framework-dependent/* "dist/WinChime-$v-win-x64.zip"
          Compress-Archive publish/self-contained/*      "dist/WinChime-$v-win-x64-self-contained.zip"
          Get-ChildItem dist | ForEach-Object {
            "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)
          }

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $notes = @"
## WinChime $v

Two downloads, pick one:

| File | Size | Needs |
|------|------|-------|
| ``WinChime-$v-win-x64.zip`` | ~0.3 MB | [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0) |
| ``WinChime-$v-win-x64-self-contained.zip`` | ~155 MB | nothing, it is fully standalone |

Windows SmartScreen will warn on first run because the binary is unsigned. Details are in the README.

WinChime does not modify system files, boot files, or firmware settings. Every change it makes is a per-user setting or a single documented registry value, and every change is reversible from inside the app.
"@
          gh release create $tag (Get-ChildItem dist | ForEach-Object { $_.FullName }) `
            --title "WinChime $v" --notes $notes
